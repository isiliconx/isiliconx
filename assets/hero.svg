<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img">
<defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7EE0FF" stop-opacity=".55"/><stop offset=".5" stop-color="#223044"/><stop offset="1" stop-color="#FFB547" stop-opacity=".55"/></linearGradient>
<radialGradient id="orbA" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#7EE0FF" stop-opacity=".38"/><stop offset="1" stop-color="#7EE0FF" stop-opacity="0"/>
</radialGradient>
<radialGradient id="orbB" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#FFB547" stop-opacity=".30"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
</radialGradient>
<linearGradient id="title" x1="0" x2="1">
  <stop offset="0" stop-color="#7EE0FF"/><stop offset=".55" stop-color="#E9F7FF"/><stop offset="1" stop-color="#FFB547"/>
</linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <path d="M28 0H0V28" fill="none" stroke="#223044" stroke-width=".6"/>
</pattern>
<linearGradient id="sweep" x1="0" x2="1">
  <stop offset="0" stop-color="#7EE0FF" stop-opacity="0"/><stop offset=".5" stop-color="#7EE0FF" stop-opacity=".07"/>
  <stop offset="1" stop-color="#7EE0FF" stop-opacity="0"/>
</linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
<linearGradient id="fade" x1="0" x2="1">
  <stop offset="0" stop-color="#0d1117" stop-opacity=".2"/><stop offset=".5" stop-color="#0d1117" stop-opacity=".85"/>
  <stop offset="1" stop-color="#0d1117" stop-opacity=".2"/>
</linearGradient></defs>
<style>
.orbA{animation:driftA 14s ease-in-out infinite alternate}
.orbB{animation:driftB 17s ease-in-out infinite alternate}
@keyframes driftA{from{transform:translate(0,0)}to{transform:translate(160px,40px)}}
@keyframes driftB{from{transform:translate(0,0)}to{transform:translate(-180px,-30px)}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.scan{animation:scan 6s linear infinite}
@keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flow{stroke-dasharray:4 10;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<g clip-path="url(#clip)">
  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity=".55"/>
  <circle class="orbA" cx="250" cy="90" r="260" fill="url(#orbA)"/>
  <circle class="orbB" cx="980" cy="230" r="280" fill="url(#orbB)"/>
  <rect width="1200" height="300" fill="url(#fade)"/>
  <line x1="820" y1="70" x2="900" y2="120" stroke="#7EE0FF" stroke-opacity=".35" class="flow"/><line x1="900" y1="120" x2="980" y2="80" stroke="#7EE0FF" stroke-opacity=".35" class="flow"/><line x1="980" y1="80" x2="1060" y2="140" stroke="#7EE0FF" stroke-opacity=".35" class="flow"/><line x1="900" y1="120" x2="940" y2="200" stroke="#7EE0FF" stroke-opacity=".35" class="flow"/><line x1="940" y1="200" x2="860" y2="230" stroke="#7EE0FF" stroke-opacity=".35" class="flow"/><line x1="940" y1="200" x2="1060" y2="140" stroke="#7EE0FF" stroke-opacity=".35" class="flow"/><line x1="1060" y1="140" x2="1100" y2="220" stroke="#7EE0FF" stroke-opacity=".35" class="flow"/><line x1="940" y1="200" x2="1030" y2="250" stroke="#7EE0FF" stroke-opacity=".35" class="flow"/><line x1="1030" y1="250" x2="1100" y2="220" stroke="#7EE0FF" stroke-opacity=".35" class="flow"/><circle cx="820" cy="70" r="9" fill="#7EE0FF" fill-opacity=".12"/><circle cx="820" cy="70" r="3.2" fill="#7EE0FF" class="pulse" style="animation-delay:0.00s"/><circle cx="900" cy="120" r="9" fill="#7EE0FF" fill-opacity=".12"/><circle cx="900" cy="120" r="3.2" fill="#7EE0FF" class="pulse" style="animation-delay:0.37s"/><circle cx="980" cy="80" r="9" fill="#7EE0FF" fill-opacity=".12"/><circle cx="980" cy="80" r="3.2" fill="#7EE0FF" class="pulse" style="animation-delay:0.74s"/><circle cx="1060" cy="140" r="9" fill="#FFB547" fill-opacity=".12"/><circle cx="1060" cy="140" r="3.2" fill="#FFB547" class="pulse" style="animation-delay:1.11s"/><circle cx="940" cy="200" r="9" fill="#FFB547" fill-opacity=".12"/><circle cx="940" cy="200" r="3.2" fill="#FFB547" class="pulse" style="animation-delay:1.48s"/><circle cx="1100" cy="220" r="9" fill="#7EE0FF" fill-opacity=".12"/><circle cx="1100" cy="220" r="3.2" fill="#7EE0FF" class="pulse" style="animation-delay:1.85s"/><circle cx="860" cy="230" r="9" fill="#7EE0FF" fill-opacity=".12"/><circle cx="860" cy="230" r="3.2" fill="#7EE0FF" class="pulse" style="animation-delay:2.22s"/><circle cx="1030" cy="250" r="9" fill="#7EE0FF" fill-opacity=".12"/><circle cx="1030" cy="250" r="3.2" fill="#7EE0FF" class="pulse" style="animation-delay:2.59s"/>
  <rect class="scan" x="0" y="0" width="220" height="300" fill="url(#sweep)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="url(#edge)" stroke-width="1"/>
<text x="64" y="92" font-family="JetBrains Mono, SFMono-Regular, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#8b98a9" text-anchor="start" >~/isilicon $ whoami</text>
<rect class="cursor" x="262" y="80" width="9" height="16" fill="#7EE0FF"/>
<text x="60" y="168" font-family="JetBrains Mono, SFMono-Regular, ui-monospace, Menlo, Consolas, monospace" font-size="76" font-weight="700" fill="url(#title)" text-anchor="start" letter-spacing="-2">isilicon</text>
<text x="64" y="212" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#e6edf3" text-anchor="start" >Security engineer building things that fail closed.</text>
<text x="64" y="244" font-family="JetBrains Mono, SFMono-Regular, ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#8b98a9" text-anchor="start" >embedded + FIDO2  ·  AI red teaming  ·  computer-use agents  ·  self-hosted LLM fleet</text>

</svg>
